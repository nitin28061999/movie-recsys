[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "MovieLens hybrid recommender: baselines, CF, content-based, serving"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scipy", "scikit-learn", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
app = ["fastapi", "uvicorn[standard]", "streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
